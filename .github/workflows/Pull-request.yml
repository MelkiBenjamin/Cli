name: Create PRs for provided-configs branches
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------
      # PR1: Prise en charge des configs externes avec Fallback
      # ---------------------------------------------------------
      - name: Create branch + files for PR1 (fallback)
        run: |
          set -euo pipefail
          BRANCH="feat/provide-configs-pr1"
          git checkout main
          git pull origin main
          git checkout -B "$BRANCH" main

          mkdir -p configs/forgejo configs/runner

          cat << 'EOF' > configs/forgejo/app.ini
          [DEFAULT]
          RUN_MODE = prod

          [server]
          HTTP_PORT = 3000
          ROOT_URL = http://localhost:3000/
          DOMAIN = localhost
          HTTP_ADDR = 127.0.0.1

          [security]
          INSTALL_LOCK = true

          [database]
          DB_TYPE = sqlite3
          PATH = /home/runner/forgejo/data/forgejo.db

          [actions]
          ENABLED = true
          EOF

          cat << 'EOF' > configs/runner/config.yaml
          log:
            level: debug
          runner:
            capacity: 1
            name: runner-zero-touch
            envs: {}
            timeout: 3h
            shutdown_timeout: 0s
            fetch_timeout: 5s
            fetch_interval: 2s
            labels:
              - "self-hosted:host"
            host:
              workdir_parent: "/home/runner/.runner_config/workdir"
          EOF

          cat << 'EOF' > patch_pr1.py
          import re

          with open("main.go", "r") as f:
              code = f.read()

          p1 = r"if _, err := os\.Stat\(appIniPath\); os\.IsNotExist\(err\) \{"
          r1 = """providedAppIni := filepath.Join("configs", "forgejo", "app.ini")
          \tif _, err := os.Stat(providedAppIni); err == nil {
          \t\tfmt.Println("[+] Utilisation de app.ini depuis configs/forgejo/")
          \t\tinput, _ := os.ReadFile(providedAppIni)
          \t\tmust(os.WriteFile(appIniPath, input, 0o644))
          \t} else if _, err := os.Stat(appIniPath); os.IsNotExist(err) {"""

          code = re.sub(p1, r1, code, count=1)

          p2 = r"must\(os\.WriteFile\(configFile, \[\]byte\(configContent\), 0o644\)\)"
          r2 = """providedRunnerConf := filepath.Join("configs", "runner", "config.yaml")
          \tif _, err := os.Stat(providedRunnerConf); err == nil {
          \t\tfmt.Println("[+] Utilisation de config.yaml depuis configs/runner/")
          \t\tinput, _ := os.ReadFile(providedRunnerConf)
          \t\tmust(os.WriteFile(configFile, input, 0o644))
          \t} else {
          \t\tmust(os.WriteFile(configFile, []byte(configContent), 0o644))
          \t}"""

          code = re.sub(p2, r2, code, count=1)

          with open("main.go", "w") as f:
              f.write(code)
          EOF

          python3 patch_pr1.py
          rm patch_pr1.py

          git add configs/ main.go
          git commit -m "feat: support external configs with fallback (PR1)" || echo "no changes"
          git push --set-upstream origin "$BRANCH" --force

      - name: Create PR1 if missing
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = 'feat/provide-configs-pr1';
            const title = 'feat: support external configs with fallback (PR1)';
            const body = 'Cette PR ajoute la gestion des configurations externes (configs/).\n- Priorite aux fichiers fournis dans configs/forgejo/app.ini et configs/runner/config.yaml.\n- Fallback sur les configurations par defaut si absent.\n- Parfait pour les environnements qui veulent des configurations personnalisees.';

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: head,
                base: 'main',
                body: body
              });
            }

      # ---------------------------------------------------------
      # PR2: Prise en charge des configs externes Stricte (No Fallback)
      # ---------------------------------------------------------
      - name: Create branch + files for PR2 (no fallback)
        run: |
          set -euo pipefail
          BRANCH="feat/provide-configs-pr2"
          git checkout main
          git pull origin main
          git checkout -B "$BRANCH" main

          mkdir -p configs/forgejo configs/runner

          cat << 'EOF' > configs/forgejo/app.ini
          [DEFAULT]
          RUN_MODE = prod

          [server]
          HTTP_PORT = 3000
          ROOT_URL = http://localhost:3000/
          DOMAIN = localhost
          HTTP_ADDR = 127.0.0.1

          [security]
          INSTALL_LOCK = true

          [database]
          DB_TYPE = sqlite3
          PATH = /home/runner/forgejo/data/forgejo.db

          [actions]
          ENABLED = true
          EOF

          cat << 'EOF' > configs/runner/config.yaml
          log:
            level: debug
          runner:
            capacity: 1
            name: runner-zero-touch
            envs: {}
            timeout: 3h
            shutdown_timeout: 0s
            fetch_timeout: 5s
            fetch_interval: 2s
            labels:
              - "self-hosted:host"
            host:
              workdir_parent: "/home/runner/.runner_config/workdir"
          EOF

          cat << 'EOF' > patch_pr2.py
          import re

          with open("main.go", "r") as f:
              code = f.read()

          p1 = r"if _, err := os\.Stat\(appIniPath\); os\.IsNotExist\(err\) \{(?:(?!\}).)*must\(os\.WriteFile\(appIniPath, \[\]byte\(initialConfig\), 0o644\)\)"
          r1 = """providedAppIni := filepath.Join("configs", "forgejo", "app.ini")
          \tif _, err := os.Stat(providedAppIni); err != nil {
          \t\tpanic("Fichier requis absent : configs/forgejo/app.ini")
          \t}
          \tinput, err := os.ReadFile(providedAppIni)
          \tmust(err)
          \tmust(os.WriteFile(appIniPath, input, 0o644))"""

          code = re.sub(p1, r1, code, flags=re.DOTALL, count=1)

          p2 = r"must\(os\.WriteFile\(configFile, \[\]byte\(configContent\), 0o644\)\)"
          r2 = """providedRunnerConf := filepath.Join("configs", "runner", "config.yaml")
          \tif _, err := os.Stat(providedRunnerConf); err != nil {
          \t\tpanic("Fichier requis absent : configs/runner/config.yaml")
          \t}
          \tinput, err := os.ReadFile(providedRunnerConf)
          \tmust(err)
          \tmust(os.WriteFile(configFile, input, 0o644))"""

          code = re.sub(p2, r2, code, count=1)

          with open("main.go", "w") as f:
              f.write(code)
          EOF

          python3 patch_pr2.py
          rm patch_pr2.py

          git add configs/ main.go
          git commit -m "feat: require provided configs (PR2 — no fallback)" || echo "no changes"
          git push --set-upstream origin "$BRANCH" --force

      - name: Create PR2 if missing
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = 'feat/provide-configs-pr2';
            const title = 'feat: require provided configs (PR2 — no fallback)';
            const body = 'Cette PR exige la presence des fichiers dans configs/.\n- Bloque l execution (panic) si configs/forgejo/app.ini ou configs/runner/config.yaml manquent.\n- Aucun fallback : configuration stricte requise.';

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: head,
                base: 'main',
                body: body
              });
            }

name: Create PRs for provided-configs branches
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------
      # PR1: Prise en charge des configs externes avec Fallback
      # ---------------------------------------------------------
      - name: Create branch + files for PR1 (fallback)
        run: |
          set -euo pipefail
          BRANCH="feat/provide-configs-pr1"
          git fetch origin main:main
          git checkout -B "$BRANCH" main

          mkdir -p configs/forgejo configs/runner

          cat > configs/forgejo/app.ini <<'EOF'
[DEFAULT]
RUN_MODE = prod

[server]
HTTP_PORT = 3000
ROOT_URL  = http://localhost:3000/
DOMAIN    = localhost
HTTP_ADDR = 127.0.0.1

[security]
INSTALL_LOCK = true

[database]
DB_TYPE = sqlite3
PATH    = /home/runner/forgejo/data/forgejo.db

[actions]
ENABLED = true
EOF

          cat > configs/runner/config.yaml <<'EOF'
log:
  level: debug
runner:
  capacity: 1
  name: runner-zero-touch
  envs: {}
  timeout: 3h
  shutdown_timeout: 0s
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "self-hosted:host"
  host:
    workdir_parent: "/home/runner/.runner_config/workdir"
EOF

          # Injection robuste via Regex pour PR1
          python3 -c '
import re

with open("main.go", "r") as f:
    code = f.read()

# 1. Remplacement injection Forgejo (Fallback)
pattern_forgejo = r"if _, err := os\.Stat\(appIniPath\); os\.IsNotExist\(err\) \{"
replacement_forgejo = """providedAppIni := filepath.Join("configs", "forgejo", "app.ini")
	if _, err := os.Stat(providedAppIni); err == nil {
		fmt.Println("[+] Utilisation de app.ini depuis configs/forgejo/")
		input, _ := os.ReadFile(providedAppIni)
		must(os.WriteFile(appIniPath, input, 0o644))
	} else if _, err := os.Stat(appIniPath); os.IsNotExist(err) {"""

code = re.sub(pattern_forgejo, replacement_forgejo, code)

# 2. Remplacement injection Runner (Fallback)
pattern_runner = r"must\(os\.WriteFile\(configFile, \[\]byte\(configContent\), 0o644\)\)"
replacement_runner = """providedRunnerConf := filepath.Join("configs", "runner", "config.yaml")
	if _, err := os.Stat(providedRunnerConf); err == nil {
		fmt.Println("[+] Utilisation de config.yaml depuis configs/runner/")
		input, _ := os.ReadFile(providedRunnerConf)
		must(os.WriteFile(configFile, input, 0o644))
	} else {
		must(os.WriteFile(configFile, []byte(configContent), 0o644))
	}"""

code = re.sub(pattern_runner, replacement_runner, code)

with open("main.go", "w") as f:
    f.write(code)
'

          git add configs/ main.go
          git commit -m "feat: support external configs with fallback (PR1)" || echo "no changes"
          git push --set-upstream origin "$BRANCH" --force

      - name: Create PR1 if missing
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = 'feat/provide-configs-pr1';
            const title = 'feat: support external configs with fallback (PR1)';
            const body = `Cette PR ajoute la gestion des configurations externes (\`configs/\`).
- Priorité aux fichiers fournis dans \`configs/forgejo/app.ini\` et \`configs/runner/config.yaml\`.
- Fallback automatique en cas d'absence.
- Conserve 100% de la chaîne de déploiement d'origine.`;
            
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', head: `${context.repo.owner}:${head}`
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, title, head, base: 'main', body });
            }

      # ---------------------------------------------------------
      # PR2: Prise en charge des configs externes Stricte (No Fallback)
      # ---------------------------------------------------------
      - name: Create branch + files for PR2 (no fallback)
        run: |
          set -euo pipefail
          BRANCH="feat/provide-configs-pr2"
          git fetch origin main:main
          git checkout -B "$BRANCH" main

          mkdir -p configs/forgejo configs/runner

          cat > configs/forgejo/app.ini <<'EOF'
[DEFAULT]
RUN_MODE = prod

[server]
HTTP_PORT = 3000
ROOT_URL  = http://localhost:3000/
DOMAIN    = localhost
HTTP_ADDR = 127.0.0.1

[security]
INSTALL_LOCK = true

[database]
DB_TYPE = sqlite3
PATH    = /home/runner/forgejo/data/forgejo.db

[actions]
ENABLED = true
EOF

          cat > configs/runner/config.yaml <<'EOF'
log:
  level: debug
runner:
  capacity: 1
  name: runner-zero-touch
  envs: {}
  timeout: 3h
  shutdown_timeout: 0s
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "self-hosted:host"
  host:
    workdir_parent: "/home/runner/.runner_config/workdir"
EOF

          # Injection robuste via Regex pour PR2
          python3 -c '
import re

with open("main.go", "r") as f:
    code = f.read()

# 1. Remplacement injection Forgejo (Mode Strict)
pattern_forgejo = r"if _, err := os\.Stat\(appIniPath\); os\.IsNotExist\(err\) \{[\s\S]*?must\(os\.WriteFile\(appIniPath, \[\]byte\(initialConfig\), 0o644\)\)"
replacement_forgejo = """providedAppIni := filepath.Join("configs", "forgejo", "app.ini")
	if _, err := os.Stat(providedAppIni); err != nil {
		panic("Fichier requis absent : configs/forgejo/app.ini")
	}
	input, err := os.ReadFile(providedAppIni)
	must(err)
	must(os.WriteFile(appIniPath, input, 0o644))"""

code = re.sub(pattern_forgejo, replacement_forgejo, code)

# 2. Remplacement injection Runner (Mode Strict)
pattern_runner = r"must\(os\.WriteFile\(configFile, \[\]byte\(configContent\), 0o644\)\)"
replacement_runner = """providedRunnerConf := filepath.Join("configs", "runner", "config.yaml")
	if _, err := os.Stat(providedRunnerConf); err != nil {
		panic("Fichier requis absent : configs/runner/config.yaml")
	}
	input, err := os.ReadFile(providedRunnerConf)
	must(err)
	must(os.WriteFile(configFile, input, 0o644))"""

code = re.sub(pattern_runner, replacement_runner, code)

with open("main.go", "w") as f:
    f.write(code)
'

          git add configs/ main.go
          git commit -m "feat: require provided configs (PR2 — no fallback)" || echo "no changes"
          git push --set-upstream origin "$BRANCH" --force

      - name: Create PR2 if missing
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = 'feat/provide-configs-pr2';
            const title = 'feat: require provided configs (PR2 — no fallback)';
            const body = `Cette PR exige la présence des fichiers dans \`configs/\`.
- Bloque l'exécution (\`panic\`) si \`configs/forgejo/app.ini\` ou \`configs/runner/config.yaml\` manquent.
- Aucun fallback automatique.`;
            
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', head: `${context.repo.owner}:${head}`
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, title, head, base: 'main', body });
            }
